<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; media-src 'self' file:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'">
  <title>本地文件管理器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 页面不再有顶部工具栏：仅保留左（工作区）/ 中（阅览区）/ 右（详情区）三栏 -->
  <div id="main-row">

    <!-- 最左侧：功能选择区（竖排），右边界中点的三角按钮可展开/隐藏 -->
    <nav id="nav-rail">
      <button class="nav-btn" data-section="dashboard" title="当前文库统计总览"><span class="nav-txt">仪表盘</span></button>
      <button class="nav-btn active" data-section="workbench" title="浏览与维护文库"><span class="nav-txt">文库操作</span></button>
      <button class="nav-btn" data-section="search" title="按标签 / 分类检索"><span class="nav-txt">搜索</span></button>
      <button class="nav-btn" data-section="records" title="打开历史记录"><span class="nav-txt">记录</span></button>
      <button id="nav-toggle" type="button" title="隐藏功能选择区">◀</button>
    </nav>

    <!-- 左：工作区 -->
    <aside id="left-panel">
      <div id="lp-body">

        <!-- 当前文库卡片（文库操作） -->
        <section class="lp-sec" data-section="workbench">
          <div class="lp-sec-title">当前文库</div>
          <div class="lib-card">
            <div class="lc-top">
              <span class="lc-icon">📚</span>
              <span class="lc-name" id="lib-card-name">未选择文库</span>
              <span class="lc-state" id="lib-card-state">—</span>
            </div>
            <div class="lc-path" id="lib-card-path" title="">尚未创建或选择文库</div>
            <div class="lc-stats">
              <div class="lc-stat"><b id="lc-stat-cat">–</b><i>大类</i></div>
              <div class="lc-stat"><b id="lc-stat-group">–</b><i>文件组</i></div>
              <div class="lc-stat"><b id="lc-stat-size">–</b><i>总大小</i></div>
            </div>
          </div>
        </section>

        <!-- 切换 / 新建 / 迁移（文库操作） -->
        <section class="lp-sec" data-section="workbench">
          <div class="lp-sec-title">文库管理</div>
          <div class="lp-btn-row">
            <button id="btn-lib-switch" title="在已登记的文库之间切换">切换</button>
            <button id="btn-lib-new" title="新建一个文库">新建</button>
            <button id="btn-lib-migrate" title="把文库整体搬到别的位置">迁移</button>
          </div>
        </section>

        <!-- 快捷操作（文库操作） -->
        <section class="lp-sec" data-section="workbench">
          <div class="lp-sec-title">快捷操作</div>
          <div class="lp-btn-row">
            <button id="btn-batch-add" class="batch-btn" title="按批次导入文件或整个文件夹，并统一填写作者 / 标签">批量添加（文件）</button>
          </div>
          <div class="lp-btn-row">
            <button id="btn-batch-add-groups" class="batch-btn" title="每个文件 / 文件夹各建一个组，统一归入一个大类，并填写作者 / 标签">批量添加（组）</button>
          </div>
          <div class="lp-btn-row">
            <button id="btn-new-group" class="primary-btn">新建组</button>
            <button id="btn-add-to-group">添加文件</button>
          </div>
          <div class="lp-btn-row">
            <button id="btn-rescan" title="重新扫描当前文库">重新扫描</button>
            <button id="btn-open-lib-root" title="在系统文件管理器中打开文库目录">打开目录</button>
          </div>
        </section>

        <!-- 文库目录树（文库操作） -->
        <section class="lp-sec" data-section="workbench">
          <div class="lp-sec-title">文库目录</div>
          <div id="lib-tree"></div>
        </section>
      </div>

      <!-- 历史记录（记录） -->
      <div id="history-box" data-section="records">
        <div class="box-title">
          <span>历史记录</span>
          <span class="title-btns">
            <button id="btn-toggle-history" title="隐藏 / 展开历史记录">隐藏</button>
            <button id="btn-clear-history" title="清空历史记录">清空</button>
          </span>
        </div>
        <div id="history-list"></div>
      </div>
    </aside>

    <div class="v-splitter" id="split-left" title="拖动调整宽度"></div>

    <!-- 主体舞台：四个功能各占一个，同一时刻只显示一个 -->
    <div id="stage-workbench" class="stage">
    <!-- 中：阅览区 -->
    <main id="preview-panel">
      <div id="preview-header">
        <div id="crumb-wrap">
          <div id="breadcrumb"></div>
          <span id="preview-name"></span>
        </div>
        <span id="preview-actions">
          <button id="btn-new-lib-inline" class="hidden" title="新建一个文库">新建文库</button>
          <button id="btn-new-cat-inline" class="hidden" title="在当前文库中新建一个大类">新建大类</button>
          <button id="btn-nav-back" title="回到上一步">后退</button>
          <button id="btn-nav-forward" title="前往下一步">前进</button>
          <button id="btn-prev-file" class="hidden" title="上一个文件">上一个</button>
          <button id="btn-next-file" class="hidden" title="下一个文件">下一个</button>
          <button id="btn-fullscreen" title="全屏预览">全屏</button>
          <button id="btn-open-external" class="hidden" title="用系统默认程序打开">打开</button>
        </span>
      </div>
      <div id="preview-body">
        <div id="preview-empty">
          <div class="empty-icon">📚</div>
          <div>正在加载文库…</div>
          <div class="empty-sub">支持图片 / 视频 / 音频 / 文本直接预览</div>
        </div>
      </div>
    </main>

    <div class="v-splitter" id="split-right" title="拖动调整宽度"></div>

    <!-- 右：详情区 -->
    <aside id="detail-panel">
      <div class="box-title">详细信息</div>
      <div id="detail-body">
        <div class="hint">未选择文件</div>
      </div>
    </aside>
    </div><!-- /#stage-workbench -->

    <!-- 仪表盘：全宽显示当前文库统计（初版） -->
    <div id="stage-dashboard" class="stage hidden">
      <div id="dashboard-body" class="stage-body"></div>
    </div>

    <!-- 搜索：全宽舞台，上方搜索控件、下方结果 -->
    <div id="stage-search" class="stage hidden">
      <div class="stage-body">
        <!-- 搜索控件（上）：范围=全部文库；名称框在最上，层级可多选，标签/作者作附加条件 -->
        <section id="search-controls" class="search-controls">
          <div class="sc-head">
            <span class="sc-title">🔍 检索全部文库</span>
            <span class="sc-scope">先在下方输入名称，再用标签 / 作者缩小范围</span>
            <button id="btn-search-mode" class="hidden" title="兼容旧版">按标签</button>
          </div>
          <!-- 1. 按名称搜索（最上方） -->
          <div class="search-row">
            <input id="search-input" type="text" placeholder="按名称搜索组 / 文件（留空则只按下方附加条件检索）…" spellcheck="false">
            <button id="btn-search" title="搜索">搜索</button>
          </div>
          <!-- 2. 搜索层级（组 / 文件，可多选） -->
          <div class="sc-levels">
            <span class="sc-label">搜索层级</span>
            <label><input type="checkbox" data-level="group" checked>组</label>
            <label><input type="checkbox" data-level="file" checked>文件</label>
          </div>
          <!-- 3. 附加条件：标签 / 作者（勾选后展开） -->
          <div class="sc-conds">
            <label class="sc-cond"><input type="checkbox" id="cond-tag-on"> 按标签（附加条件）</label>
            <div id="cond-tag-box" class="sc-cond-box hidden">
              <div class="sc-cond-hint">点选已有标签作为需同时满足的条件；也可输入新标签后回车。</div>
              <div id="cond-tag-selected" class="tag-chips"></div>
              <input id="cond-tag-input" class="sc-cond-input" placeholder="输入标签名后回车添加…" spellcheck="false">
              <div id="cond-tag-bank" class="sc-cond-bank"></div>
              <div id="cond-tag-pager"></div>
            </div>
            <label class="sc-cond"><input type="checkbox" id="cond-author-on"> 按作者（附加条件）</label>
            <div id="cond-author-box" class="sc-cond-box hidden">
              <div class="sc-cond-hint">点选已有作者作为需同时满足的条件；也可输入新作者后回车。</div>
              <div id="cond-author-selected" class="tag-chips"></div>
              <input id="cond-author-input" class="sc-cond-input" placeholder="输入作者名后回车添加…" spellcheck="false">
              <div id="cond-author-bank" class="sc-cond-bank"></div>
              <div id="cond-author-pager"></div>
            </div>
          </div>
          <!-- 兼容旧逻辑用的隐藏容器（不再可见） -->
          <div id="cat-chips" class="hidden"></div>
          <div id="lib-tag-chips" class="tag-chips hidden"></div>
          <div id="lib-author-chips" class="tag-chips hidden"></div>
        </section>
        <!-- 结果区（下）：由 renderSearchStage 填充 -->
        <div id="search-stage-body"></div>
      </div>
    </div>

    <!-- 记录：全宽显示历史记录（初版） -->
    <div id="stage-records" class="stage hidden">
      <div id="records-stage-body" class="stage-body"></div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div id="context-menu" class="hidden"></div>

  <!-- 通用对话框 -->
  <div id="modal-mask" class="hidden">
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-buttons">
        <button id="modal-cancel">取消</button>
        <button id="modal-ok">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
